version: 2

project_name: sagio

builds:
  - id: default
    main: ./cmd/server/main.go
    binary: sagio
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
        
checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: TheAppleKingy
    name: sagio